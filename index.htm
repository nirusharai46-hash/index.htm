<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A bouquet for you</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:Georgia,'Times New Roman',serif;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
svg{height:86%;max-width:100%;cursor:pointer;overflow:visible}
#bq{transform-origin:200px 520px;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.wrap{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.8}50%{opacity:1}}
.head{transform:scale(.8);transition:transform 1s cubic-bezier(.3,1.4,.5,1) var(--d)}
.open .head{transform:scale(1.08)}
.p{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.1s cubic-bezier(.3,1.5,.5,1) var(--d),opacity .8s var(--d)}
.pl{transform:translate(-3px,0) rotate(15deg)}
.pr{transform:translate(3px,0) rotate(-15deg)}
.pc{transform:scale(.93)}
.pb{transform:scale(.7);opacity:0}
.open .pl{transform:translate(-6px,0) rotate(-40deg)}
.open .pr{transform:translate(6px,0) rotate(40deg)}
.open .pc{transform:scale(1.08)}
.open .pb{transform:scale(1.05);opacity:1}
.tulip{cursor:pointer}
.tulip:hover .head{filter:brightness(1.15)}
.leaf{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1s ease var(--d)}
.open .leaf{transform:scale(1.15)}
#msg{position:absolute;top:calc(env(safe-area-inset-top,0px) + 7%);left:0;right:0;text-align:center;color:#ffd1e3;font-size:clamp(22px,6vw,34px);font-style:italic;letter-spacing:.04em;text-shadow:0 0 14px #ff5fa2,0 0 30px #ff2d87;opacity:0;transform:translateY(10px);transition:all 1.4s ease;pointer-events:none}
#msg.show{opacity:1;transform:none}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 4%);left:0;right:0;text-align:center;color:#ffb5d3;font-size:15px;letter-spacing:.2em;text-transform:lowercase;opacity:.75;animation:blink 2.4s ease-in-out infinite;pointer-events:none}
@keyframes blink{50%{opacity:.25}}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#ffd6ea;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}
.fx{position:fixed;pointer-events:none;font-size:18px;animation:fly 2.2s ease-out forwards;z-index:5}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.6)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.2)}}
</style>
</head>
<body>
<div id="stage">
<div id="msg"></div>
<svg id="svg" viewBox="0 0 400 620" aria-label="Tap the bouquet to make the tulips bloom">
<defs>
<linearGradient id="gl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d63a74"/><stop offset="1" stop-color="#ff7aa8"/></linearGradient>
<linearGradient id="gr" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e0487f"/><stop offset="1" stop-color="#ff8db4"/></linearGradient>
<linearGradient id="gc" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ee5a8c"/><stop offset="1" stop-color="#ff9fc0"/></linearGradient>
<linearGradient id="gb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b8285f"/><stop offset="1" stop-color="#e8558a"/></linearGradient>
<linearGradient id="gg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3f9a2a"/><stop offset="1" stop-color="#8fdc55"/></linearGradient>
<linearGradient id="bw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9bc0"/><stop offset="1" stop-color="#e0568c"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="5" result="b1"/><feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b2"/>
<feMerge><feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<g id="bq"></g>
</svg>
<div id="hint">tap the bouquet</div>
</div>
<script>
// ✎ Change this message (shows when every tulip has bloomed)
const MESSAGE = "Yugal, my baby I LOVE U THE MOST ♡";

const NS = 'http://www.w3.org/2000/svg';
const PETAL = 'M0 0C-13-5-15-27 0-43C15-27 13-5 0 0Z';
// [x, y, scale] – tulip head positions
const T = [[92,262,.95],[200,218,1.1],[308,262,.95],[148,296,1],[252,296,1],[200,302,1.05],[116,342,.8],[284,342,.8],[200,356,.85]]
  .sort((a,b)=>a[1]-b[1]);

let h = '';
// back rim of the wrapper
h += '<g class="wrap" filter="url(#glow)" fill="none" stroke="#ffd9ea" stroke-width="2.5" stroke-linecap="round"><path d="M70 332Q200 285 332 330" opacity=".7"/></g>';
// stems
h += '<g stroke="#4aa832" stroke-width="4" fill="none" stroke-linecap="round">';
T.forEach(([x,y,s])=>{ h += `<path d="M${x} ${y}Q${x+(200-x)*.15} ${y+80} 200 450"/>`; });
h += '</g>';
// tulips
T.forEach(([x,y,s],i)=>{
  const d = (i*0.12).toFixed(2)+'s';
  const flip = x < 200 ? -1 : 1;
  h += `<g class="tulip" data-i="${i}" transform="translate(${x} ${y}) scale(${s})" style="--d:${d}">
  <path class="leaf" fill="url(#gg)" d="M0 50C${26*flip} 42 ${30*flip} 16 ${20*flip} 4C${12*flip} 20 ${6*flip} 34 0 50Z"/>
  <path class="leaf" fill="url(#gg)" d="M0 62C${-24*flip} 54 ${-28*flip} 30 ${-18*flip} 18C${-10*flip} 32 ${-5*flip} 46 0 62Z"/>
  <g class="head">
    <path class="p pb" fill="url(#gb)" d="${PETAL}"/>
    <path class="p pl" fill="url(#gl)" d="${PETAL}"/>
    <path class="p pr" fill="url(#gr)" d="${PETAL}"/>
    <path class="p pc" fill="url(#gc)" d="${PETAL}"/>
  </g></g>`;
});
// neon wrapper (front)
let r = 7; const rnd = () => (r = (r*9301+49297)%233280)/233280;
h += '<g class="wrap" filter="url(#glow)" fill="none" stroke="#ffd9ea" stroke-linecap="round">';
h += '<path stroke-width="3" d="M70 332Q200 392 332 330"/>';
h += '<path stroke-width="3" d="M70 332Q104 428 192 458"/><path stroke-width="3" d="M332 330Q296 428 208 458"/>';
for(let i=0;i<13;i++){ // scribble hatching
  const t=i/12, x0=84+t*236, y0=352+Math.sin(t*3.14)*28, x1=200+(t-.5)*34;
  h += `<path stroke-width="${1.5+rnd()*1.5}" opacity="${.45+rnd()*.5}" d="M${x0} ${y0}Q${(x0+x1)/2+(rnd()-.5)*22} ${(y0+450)/2} ${x1} 452"/>`;
}
for(let i=0;i<15;i++){ // splayed tails
  const x=108+i*13+rnd()*8, y=572+rnd()*40;
  h += `<path stroke-width="${2+rnd()*2}" opacity="${.55+rnd()*.45}" d="M${196+(i-7)*2} 470L${x} ${y}"/>`;
}
h += '</g>';
// bow
h += `<g>
<path d="M200 462C150 418 112 440 124 474C132 500 172 490 200 468Z" fill="url(#bw)"/>
<path d="M200 462C250 418 288 440 276 474C268 500 228 490 200 468Z" fill="url(#bw)"/>
<path d="M188 474L162 518L196 504Z" fill="#d94d85"/><path d="M212 474L240 518L204 504Z" fill="#d94d85"/>
<path d="M140 462C156 452 176 456 192 466M260 462C244 452 224 456 208 466" stroke="#ff9cc2" stroke-width="2" fill="none" opacity=".7"/>
<ellipse cx="200" cy="468" rx="15" ry="13" fill="#ee6a9c"/><ellipse cx="197" cy="464" rx="6" ry="4" fill="#ff9cc2" opacity=".7"/></g>`;
document.getElementById('bq').innerHTML = h;

// stars
for(let i=0;i<40;i++){const s=document.createElement('div');s.className='star';
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;
  document.getElementById('stage').appendChild(s);}

const tulips=[...document.querySelectorAll('.tulip')];
const msg=document.getElementById('msg'), hint=document.getElementById('hint');
msg.textContent = MESSAGE;

function burst(x,y,n=8){
  const e=['🌸','✨','💖','🌷','✨','🩷'];
  for(let i=0;i<n;i++){
    const f=document.createElement('span');f.className='fx';f.textContent=e[Math.floor(Math.random()*e.length)];
    f.style.left=x+'px';f.style.top=y+'px';
    f.style.setProperty('--x',(Math.random()-.5)*160+'px');
    f.style.setProperty('--y',(-40-Math.random()*150)+'px');
    f.style.setProperty('--r',(Math.random()-.5)*360+'deg');
    document.body.appendChild(f);setTimeout(()=>f.remove(),2300);
  }
}
function update(){
  const all=tulips.every(t=>t.classList.contains('open'));
  msg.classList.toggle('show',all);
  hint.style.opacity = '';
  hint.textContent = all ? 'tap again to close' : 'tap the bouquet';
}
function bloom(t){
  t.classList.add('open');
  const b=t.getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/3,4);
}
document.getElementById('svg').addEventListener('click',e=>{
  const t=e.target.closest('.tulip');
  if(t){ t.classList.contains('open') ? t.classList.remove('open') : bloom(t); }
  else if(tulips.every(x=>x.classList.contains('open'))){ tulips.forEach(x=>x.classList.remove('open')); }
  else { tulips.forEach((x,i)=>setTimeout(()=>{ if(!x.classList.contains('open')) bloom(x); update(); }, i*220)); }
  update();
});
</script>
</body>
</html>
